# devices/sapphiren/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device sapphiren
	title       Redmi Note 13 4G NFC
	vendor      Xiaomi
	soc         khaje
	defconfig   sapphiren_defconfig
	maintainer  NeonDev
	status      display     works     the panel (1080x2400 at 0x5c000000, as the bootloader leaves it): U-Boot, the loader and the Darwin user space (SpringBoard) draw on it, by the CPU, at about 9 frames a second; no GPU, no compositing hardware
	status      cpu         partial   boots on core 0 alone (cpus=1) on an ARMv8.0 SoC: kernel built with HAKIOS_ARMV8_0=1 (no PAN), GIC group 1 enabled with bits 0|1|4, virtual timer on PPI 19 (soc_vtimer=19); a kernel started on another core by PSCI hangs before it prints anything
	status      usb         partial   U-Boot's fastboot and the loader's own (xl) work in device mode at high speed through the Synopsys Femto PHY (hsphy@1613000); nothing from the kernel yet
	status      storage     missing   U-Boot's ufs init hangs; the kernel's UFS driver is not tried
	status      touch       partial   the FocalTech FTS (I2C 0x38; the tree lists a Synaptics and a Novatek as well) found and read by hand on GPIO 6/7 (synaptics_tcm=1); no finger seen yet
	status      gpu         missing   Adreno 610: the Metal path knows only the Adreno of chip ID 0x06030500
	status      audio       missing
	status      battery     partial   a fixed level: Android's, passed as battery_level=N at the start of the run; no gauge
	status      bluetooth   missing
	status      cellular    missing
	status      haptic      missing
	status      camera      missing
	status      thermal     missing
