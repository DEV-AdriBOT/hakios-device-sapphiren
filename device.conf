# devices/sapphiren/device.conf: the tested state of this device.

device sapphiren
	title       Redmi Note 13 4G NFC
	vendor      Xiaomi
	soc         khaje
	defconfig   sapphiren_defconfig
	maintainer  NeonDev
	status      display     works     the panel and Darwin SpringBoard are usable; the framebuffer/compositor path still needs performance work
	status      cpu         works     all 8 cores run under the Khaje-specific XNU setup; the kernel needs HAKIOS_ARMV8_0=1 and virtual timer INTID 19
	status      usb         partial   U-Boot fastboot and the loader's USB device mode work through the Synopsys Femto PHY; kernel USB is not complete
	status      storage     partial   native UFS read access and the on-device darwin partition work experimentally; U-Boot's ufs init still hangs and write support is not validated
	status      touch       partial   the FocalTech FTS at I2C 0x38 works in tests and reaches SpringBoard; cold-boot firmware loading and swipe reliability still need validation
	status      gpu         partial   the Adreno 610 can execute the experimental non-GMU path and Mesa OpenGL ES identifies FD610; performance and Metal integration are incomplete
	status      wifi        missing   Khaje legacy-WLAN/MPSS bring-up is in progress but has not been validated
	status      audio       missing
	status      battery     partial   a battery level can be passed from Android; there is no native gauge driver
	status      bluetooth  missing
	status      cellular   missing
	status      haptic     missing
	status      camera     missing
	status      thermal    missing
